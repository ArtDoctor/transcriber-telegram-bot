services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: 1
    command:
      - --dir=/var/lib/telegram-bot-api
      - --http-ip-address=0.0.0.0
      - --http-port=8081
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      # Exposed only on localhost for debugging. The bot talks to it over the
      # compose network, so there is no need to expose it publicly.
      - "127.0.0.1:8081:8081"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081/bot
      TELEGRAM_BOT_API_BASE_FILE_URL: http://telegram-bot-api:8081/file/bot
      TELEGRAM_LOCAL_MODE: "true"
      MAX_TELEGRAM_DOWNLOAD_BYTES: 2147483648
      MAX_TELEGRAM_UPLOAD_BYTES: 2147483648
      TELEGRAM_READ_TIMEOUT: 900
      TELEGRAM_WRITE_TIMEOUT: 900
      # Route yt-dlp through the warp service below unless a different proxy
      # (e.g. a residential one) is set in .env.
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-socks5h://warp:1080}
    volumes:
      # Required for --local mode: getFile returns paths inside the Bot API
      # server data directory, and PTB copies them directly.
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    depends_on:
      - telegram-bot-api
      - warp

  # Cloudflare WARP exposed as a SOCKS5/HTTP proxy on warp:1080. YouTube flags
  # datacenter IPs with "Sign in to confirm you're not a bot"; going out through
  # WARP makes requests come from a Cloudflare IP instead of the VPS IP.
  # https://github.com/cmj2002/warp-docker
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    # Allow access to /dev/net/tun (removed from runc's default device rules)
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      WARP_SLEEP: 2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      # Keeps the WARP registration across restarts.
      - warp-data:/var/lib/cloudflare-warp

  telegram-cache-cleaner:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    environment:
      # Delete cached Telegram Bot API files older than this many minutes.
      TELEGRAM_CACHE_MAX_AGE_MINUTES: 120
      TELEGRAM_CACHE_CLEAN_INTERVAL_SECONDS: 3600
    command: >
      sh -c 'while true; do
        echo "Cleaning Telegram Bot API cache files older than $${TELEGRAM_CACHE_MAX_AGE_MINUTES} minutes...";
        find /var/lib/telegram-bot-api -type f -mmin +$${TELEGRAM_CACHE_MAX_AGE_MINUTES} -delete;
        sleep $${TELEGRAM_CACHE_CLEAN_INTERVAL_SECONDS};
      done'
    depends_on:
      - telegram-bot-api

volumes:
  telegram-bot-api-data:
  warp-data:
